<header class="sticky top-0 z-40 border-b border-stone-800 bg-stone-950/90 backdrop-blur">
  <div class="mx-auto flex w-full max-w-7xl items-center gap-4 px-4 py-3 sm:px-6">
    <a routerLink="/dashboard" class="flex items-center gap-2.5" aria-label="FermentLab home">
      <span class="grid size-9 place-items-center rounded-lg bg-amber-500 text-lg text-stone-950">🫙</span>
      <span class="text-lg font-semibold tracking-tight">Ferment<span class="text-amber-500">Lab</span></span>
    </a>

    <nav class="ml-4 hidden items-center gap-1 md:flex" aria-label="Main">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path"
           routerLinkActive="bg-stone-800 text-stone-50"
           class="rounded-lg px-3 py-2 text-sm font-medium text-stone-400 transition-colors hover:bg-stone-800/70 hover:text-stone-100">
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="ml-auto flex items-center gap-2">
      <a routerLink="/alerts"
         routerLinkActive="bg-stone-800 text-stone-50"
         class="relative rounded-lg px-3 py-2 text-sm font-medium text-stone-400 transition-colors hover:bg-stone-800/70 hover:text-stone-100"
         [attr.aria-label]="'Alerts, ' + openAlertCount() + ' open'">
        <span aria-hidden="true">🔔</span>
        <span class="ml-1 hidden sm:inline">Alerts</span>
        @if (openAlertCount() > 0) {
          <span class="absolute -right-1 -top-1 grid min-w-5 place-items-center rounded-full bg-red-600 px-1
                       text-xs font-semibold text-white">
            {{ openAlertCount() }}
          </span>
        }
      </a>

      <button type="button"
              class="btn-ghost md:hidden"
              [attr.aria-expanded]="menuOpen()"
              aria-controls="mobile-nav"
              aria-label="Toggle navigation"
              (click)="toggleMenu()">
        <span aria-hidden="true">☰</span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav id="mobile-nav" class="border-t border-stone-800 px-4 py-2 md:hidden" aria-label="Main, mobile">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path"
           routerLinkActive="bg-stone-800 text-stone-50"
           class="block rounded-lg px-3 py-2.5 text-sm font-medium text-stone-300 hover:bg-stone-800"
           (click)="closeMenu()">
          {{ item.label }}
        </a>
      }
    </nav>
  }
</header>
