<div class="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-black/70 p-4"
     role="dialog"
     aria-modal="true"
     aria-labelledby="batch-form-title">
  <div class="my-8 w-full max-w-2xl rounded-xl border border-stone-800 bg-stone-900 shadow-2xl">
    <div class="flex items-center justify-between border-b border-stone-800 px-5 py-4">
      <h2 id="batch-form-title" class="text-lg font-semibold">Start a batch</h2>
      <button type="button" class="btn-ghost" aria-label="Close" (click)="closed.emit()">&times;</button>
    </div>

    <form class="grid gap-4 p-5 sm:grid-cols-2" (ngSubmit)="submit()">
      <div class="sm:col-span-2">
        <label class="field-label" for="bf-name">Name</label>
        <input id="bf-name" class="field" name="name" [(ngModel)]="name" required maxlength="150"
               placeholder="Mango kombucha #13">
      </div>

      <div>
        <label class="field-label" for="bf-type">Ferment style</label>
        <select id="bf-type" class="field" name="fermentTypeId"
                [(ngModel)]="fermentTypeId" (ngModelChange)="onFermentTypeChange()" required>
          <option value="">Choose a style…</option>
          @for (type of fermentTypes(); track type.id) {
            <option [value]="type.id">{{ type.name }}</option>
          }
        </select>
      </div>

      <div>
        <label class="field-label" for="bf-recipe">Recipe (optional)</label>
        <select id="bf-recipe" class="field" name="recipeId"
                [(ngModel)]="recipeId" (ngModelChange)="onRecipeChange()">
          <option value="">No recipe, free form</option>
          @for (recipe of selectableRecipes(); track recipe.id) {
            <option [value]="recipe.id">{{ recipe.name }} ({{ recipe.totalDurationDays }} d)</option>
          }
        </select>
        <p class="mt-1 text-xs text-stone-500">Copies the method onto the batch as its timeline.</p>
      </div>

      <div>
        <label class="field-label" for="bf-culture">Culture (optional)</label>
        <select id="bf-culture" class="field" name="cultureId" [(ngModel)]="cultureId">
          <option value="">Wild / none</option>
          @for (culture of selectableCultures(); track culture.id) {
            <option [value]="culture.id">{{ culture.name }} (gen {{ culture.generation }})</option>
          }
        </select>
      </div>

      <div>
        <label class="field-label" for="bf-start">Start date</label>
        <input id="bf-start" type="date" class="field" name="startedOn" [(ngModel)]="startedOn">
        <p class="mt-1 text-xs text-stone-500">A future date creates a planned batch.</p>
      </div>

      <div>
        <label class="field-label" for="bf-container">Container</label>
        <input id="bf-container" class="field" name="container" [(ngModel)]="container" maxlength="100"
               placeholder="5 L glass jar">
      </div>

      <div class="grid grid-cols-3 gap-2">
        <div class="col-span-2">
          <label class="field-label" for="bf-size">Batch size</label>
          <input id="bf-size" type="number" step="0.001" min="0" class="field" name="batchSize"
                 [(ngModel)]="batchSize">
        </div>
        <div>
          <label class="field-label" for="bf-unit">Unit</label>
          <select id="bf-unit" class="field" name="batchSizeUnit" [(ngModel)]="batchSizeUnit">
            <option value="L">L</option>
            <option value="ml">ml</option>
            <option value="kg">kg</option>
            <option value="g">g</option>
          </select>
        </div>
      </div>

      <div class="sm:col-span-2">
        <label class="field-label" for="bf-location">Location</label>
        <input id="bf-location" class="field" name="location" [(ngModel)]="location" maxlength="100"
               placeholder="Pantry shelf">
      </div>

      <div class="sm:col-span-2">
        <label class="field-label" for="bf-notes">Notes</label>
        <textarea id="bf-notes" class="field" name="notes" rows="3" [(ngModel)]="notes" maxlength="2000"
                  placeholder="Anything you want to remember about this run."></textarea>
      </div>

      <div class="flex justify-end gap-2 sm:col-span-2">
        <button type="button" class="btn-secondary" (click)="closed.emit()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="saving()">
          {{ saving() ? 'Starting…' : 'Start batch' }}
        </button>
      </div>
    </form>
  </div>
</div>
