server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build output can be cached hard; index.html must not be.
    #
    # Only add_header is used: combining it with `expires` makes nginx emit two Cache-Control
    # headers for the same response.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Proxy the API so the browser only ever talks to one origin.
    location /api/ {
        proxy_pass http://app-rest:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular client side routing.
    #
    # `no-store` has to live here rather than in a `location = /index.html` block: a deep link such
    # as /recipes is served through this try_files fallback, which stays in this location and would
    # therefore never pick up headers set on an exact-match location. Without it the browser caches
    # an index.html that points at the previous build's hashed chunks, and a rebuilt image keeps
    # serving the old application.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
