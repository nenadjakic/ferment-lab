spring.application.name=ferment-lab-scheduler
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/fermentlab
spring.datasource.username=fermentlab
spring.datasource.password=fermentlab
spring.datasource.hikari.maximum-pool-size=5

# The REST application owns the migrations; the scheduler only reads and writes rows.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false

# Every 30 minutes by default.
fermentlab.scheduler.cron=${FERMENTLAB_SCHEDULER_CRON:0 */30 * * * *}
fermentlab.scheduler.alert-retention-days=30

management.endpoints.web.exposure.include=health,info

logging.level.com.github.nenadjakic.fermentlab=INFO
