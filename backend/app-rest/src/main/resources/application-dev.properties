# Development profile: adds the demo library on top of the schema and reference data.
#
# `migrations-seed` holds the recipe library plus demo cultures, batches, measurements and journal
# entries, so a fresh dev database is immediately explorable. The seed migrations carry versions
# later than every baseline one, so switching a database between profiles never triggers an
# out-of-order migration.
spring.flyway.locations=classpath:/migrations,classpath:/migrations-seed

logging.level.com.github.nenadjakic.fermentlab=DEBUG
