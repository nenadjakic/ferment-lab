# Production profile: schema and reference data, never demo data.
#
# Stated explicitly rather than inherited so that an accidental edit to the default properties cannot
# quietly start seeding a production database.
spring.flyway.locations=classpath:/migrations
spring.flyway.clean-disabled=true

# A production database is migrated by a controlled deployment, not baselined on the fly.
spring.flyway.baseline-on-migrate=false
