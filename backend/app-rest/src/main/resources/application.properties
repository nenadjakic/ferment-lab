spring.application.name=ferment-lab-app-rest
server.port=8080

# Datasource. Overridden by SPRING_DATASOURCE_* environment variables in Docker Compose.
spring.datasource.url=jdbc:postgresql://localhost:5432/fermentlab
spring.datasource.username=fermentlab
spring.datasource.password=fermentlab
spring.datasource.hikari.maximum-pool-size=10

# Flyway owns the schema, so Hibernate must never touch it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=32

# Schema plus reference data only. The demo library in `classpath:/migrations-seed` is opted into by
# the dev and test profiles, so no profile - and therefore prod - never gets seed data.
spring.flyway.enabled=true
spring.flyway.locations=classpath:/migrations
spring.flyway.baseline-on-migrate=true

# Jackson 3 already writes ISO-8601 timestamps by default, so only the null handling needs setting.
spring.jackson.default-property-inclusion=non_null

# Origins allowed to call the API from a browser.
fermentlab.cors.allowed-origins=${FERMENTLAB_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

logging.level.com.github.nenadjakic.fermentlab=INFO
